name: Audit 2026-09-12 divine pronoun residuals

on:
  push:
    branches:
      - audit/2026-09-12-divine-pronoun-residuals
    paths:
      - tools/local/audit_divine_pronoun_residuals_2026_09_12.py
      - tools/local/audit_divine_pronoun_high_confidence_2026_09_12.py
      - tools/local/split_divine_pronoun_triage_2026_09_12.py
      - .github/workflows/audit-2026-09-12-divine-pronoun-residuals.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/2026-09-12-divine-pronoun-residuals
          fetch-depth: 1
      - name: Audit current canonical EPUB
        run: |
          python3 tools/local/audit_divine_pronoun_residuals_2026_09_12.py
          python3 tools/local/audit_divine_pronoun_high_confidence_2026_09_12.py
          python3 tools/local/split_divine_pronoun_triage_2026_09_12.py
      - name: Commit audit reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            change-logs/reports/2026-09-12-divine-pronoun-residual-audit.json \
            change-logs/reports/2026-09-12-divine-pronoun-high-confidence-triage.json \
            editor-notes/consistency/2026-09-12-divine-pronoun-residual-audit.md \
            editor-notes/consistency/2026-09-12-divine-pronoun-high-confidence-triage.md \
            editor-notes/consistency/divine-pronoun-triage-2026-09-12
          if ! git diff --cached --quiet; then
            git commit -m "Audit residual divine masculine pronouns"
            git push origin HEAD:audit/2026-09-12-divine-pronoun-residuals
          fi
