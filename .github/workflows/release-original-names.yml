name: Release original-name consistency update

on:
  push:
    branches:
      - consistency/original-names-genesis-2026-09-11
    paths:
      - .github/workflows/release-original-names.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: consistency/original-names-genesis-2026-09-11
          fetch-depth: 1
      - name: Compile release builder
        run: python3 -m py_compile tools/local/release_original_names.py
      - name: Build and validate canonical EPUB
        run: python3 tools/local/release_original_names.py
      - name: Commit canonical release and self-clean
        run: |
          rm .github/workflows/release-original-names.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add current-form-documents/the-way-current.epub current-form-documents/README.md README.md rendered-documents-history/LOG.md rendered-documents-history/ editor-notes/consistency/2026-09-11-original-name-consistency.md change-logs/reports/2026-09-11-original-name-consistency.json .github/workflows/release-original-names.yml
          git commit -m "consistency: publish original-name and Genesis wording update"
          git push origin HEAD:consistency/original-names-genesis-2026-09-11
