name: Audit NT divine masculine pronouns 2026-10-12
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/audit-2026-10-12-nt-divine-masculine-residuals.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Scan all 27 NT books against canonical EPUB
        run: python tools/local/audit_2026_10_12_nt_divine_masculine_residuals.py
      - name: Save complete candidate report and human-readable triage
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add change-logs/reports/2026-10-12-new-testament-divine-masculine-candidate-audit.json change-logs/reports/2026-10-12-new-testament-divine-masculine-candidate-audit.md
          git diff --cached --quiet && exit 0
          git commit -m 'Record 27-book NT divine masculine candidate audit'
          git push origin HEAD:main
