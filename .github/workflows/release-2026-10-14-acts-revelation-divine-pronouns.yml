name: Release Acts Revelation God pronoun cleanup 2026-10-14
on:
  push:
    branches: [main]
    paths: ['.github/workflows/release-2026-10-14-acts-revelation-divine-pronouns.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: way-acts-revelation-god-pronouns-20261014
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Audit all 23 Acts-Revelation books then release exact 66 context-approved verses
        run: python tools/local/release_2026_10_14_acts_revelation_divine_pronouns.py
      - name: Commit canonical Bible EPUB, complete audit, exact release, original-source alignment, mobile fallback
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github-actions[bot].noreply.github.com'
          git add current-form-documents/the-way-current.epub current-form-documents/mobile-reader current-form-documents/original-name-registry.json original-documents/rest_of_new_testament_restorative_translation.txt rendered-documents-history change-logs/reports/2026-10-14-acts-revelation-divine-pronouns-release.json change-logs/reports/2026-10-14-acts-revelation-masculine-pronoun-candidates.json change-logs/reports/2026-10-14-acts-revelation-masculine-pronoun-candidates.md editor-notes/consistency/2026-10-14-acts-revelation-divine-pronouns-release.md README.md current-form-documents/README.md current-form-documents/EPUB-REFRESH-INSTRUCTIONS.md rendered-documents-history/LOG.md
          git diff --cached --quiet && { echo 'No canonical output; refusing success' >&2; exit 1; }
          git commit -m 'Release 66 reviewed Acts-Revelation God gender residuals after complete 23-book scan'
          git push origin HEAD:main
