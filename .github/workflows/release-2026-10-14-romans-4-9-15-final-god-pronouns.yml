name: Release four Romans God pronoun finishing edits 2026-10-14
on:
  push:
    branches: [main]
    paths: ['.github/workflows/release-2026-10-14-romans-4-9-15-final-god-pronouns.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: way-romans-4-9-15-20261014
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate and publish exactly four contextual God reference Scripture verses
        run: python tools/local/release_2026_10_14_romans_followup_divine_pronouns.py
      - name: Preserve old EPUB and commit canonical Scripture, public fallback, editorial print note
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add current-form-documents/the-way-current.epub current-form-documents/mobile-reader current-form-documents/original-name-registry.json original-documents/rest_of_new_testament_restorative_translation.txt rendered-documents-history change-logs/reports/2026-10-14-romans-followup-4-divine-pronoun-release.json editor-notes/consistency/2026-10-14-romans-followup-4-divine-pronoun-release.md README.md current-form-documents/README.md current-form-documents/EPUB-REFRESH-INSTRUCTIONS.md rendered-documents-history/LOG.md
          git diff --cached --quiet && { echo 'No canonical changes made' >&2; exit 1; }
          git commit -m 'Release four additional Romans God pronouns after 66 verse audit'
          git push origin HEAD:main
