name: Diagnose verse record duplicates 2026-09-15

on:
  push:
    branches:
      - release/romans-structural-cleanup-2026-09-15
    paths:
      - tools/local/diagnose_duplicate_verse_records_2026_09_15.py
      - .github/workflows/diagnose-verse-record-duplicates-2026-09-15.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/romans-structural-cleanup-2026-09-15
      - run: python tools/local/diagnose_duplicate_verse_records_2026_09_15.py
