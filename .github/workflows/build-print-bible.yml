name: Build print Bible

on:
  push:
    branches:
      - chatgpt/print-bible-build-20260907
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libreoffice poppler-utils fonts-liberation2 fonts-noto-core
          python -m pip install --upgrade pip
          pip install python-docx lxml
      - name: Restore print build script
        shell: bash
        run: |
          cat > /tmp/build_print_bible.py.gz.b64 <<'B64'

B64
          base64 -d /tmp/build_print_bible.py.gz.b64 | gzip -d > /tmp/build_print_bible.py
          python -m py_compile /tmp/build_print_bible.py
      - name: Build whole Bible DOCX and proof PDF
        run: |
          python /tmp/build_print_bible.py --repo-root "$GITHUB_WORKSPACE" --outdir print-build
      - name: Upload print build
        uses: actions/upload-artifact@v4
        with:
          name: way-print-bible
          path: |
            print-build/The_Bible_With_Original_Names_The_Way_Version_Print_Master.docx
            print-build/The_Bible_With_Original_Names_The_Way_Version_Print_Proof.pdf
            print-build/print_build_report.json
          if-no-files-found: error
