name: Release Romans 11 34-36 divine pronoun correction 2026-10-14
on:
  push:
    branches: [main]
    paths: ['.github/workflows/release-2026-10-14-romans-11-divine-pronouns.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: way-20261014-romans11-canonical
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Release three reviewed Romans verses and validate all 31,102 Bible records
        run: python tools/local/release_2026_10_14_romans_11_34_36_divine_neutral.py
      - name: Commit exact canonical release and physical print handoff
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add original-documents/rest_of_new_testament_restorative_translation.txt current-form-documents/the-way-current.epub current-form-documents/mobile-reader current-form-documents/original-name-registry.json rendered-documents-history change-logs/reports/2026-10-14-romans-11-34-36-god-referents-release.json editor-notes/consistency/2026-10-14-romans-11-34-36-god-referents-release.md README.md current-form-documents/README.md current-form-documents/EPUB-REFRESH-INSTRUCTIONS.md rendered-documents-history/LOG.md
          git diff --cached --quiet && { echo 'No canonical changes produced' >&2; exit 1; }
          git commit -m 'Release Romans 11:34-36 God pronouns and neutral human referent'
          git push origin HEAD:main
