name: Audit 2026-09-14 New Testament gender and lexical residuals

on:
  push:
    branches:
      - audit/new-testament-gender-brokenness-2026-09-14
    paths:
      - 'tools/local/audit_new_testament_gender_brokenness_2026_09_14.py'
      - '.github/workflows/audit-2026-09-14-new-testament-gender-brokenness.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit/new-testament-gender-brokenness-2026-09-14
          fetch-depth: 1
      - name: Run New Testament audit
        run: python3 tools/local/audit_new_testament_gender_brokenness_2026_09_14.py
      - name: Commit audit output
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit-output/new-testament-gender-brokenness-2026-09-14
          if ! git diff --cached --quiet; then
            git commit -m "Add New Testament gender and lexical audit output"
            git push origin HEAD:audit/new-testament-gender-brokenness-2026-09-14
          fi
