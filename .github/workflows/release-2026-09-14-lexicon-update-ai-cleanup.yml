name: Release lexicon update AI cleanup 2026-09-14

on:
  push:
    branches:
      - release/lexicon-update-ai-cleanup-2026-09-14
    paths:
      - tools/local/approved_lexicon_cleanup_2026_09_14.tsv
      - tools/local/release_2026_09_14_lexicon_update_ai_cleanup.py
      - tools/local/release_2026_09_14_lexicon_update_ai_cleanup_v2.py
      - .github/workflows/release-2026-09-14-lexicon-update-ai-cleanup.yml

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/lexicon-update-ai-cleanup-2026-09-14
      - name: Run exact canonical lexicon release
        run: python tools/local/release_2026_09_14_lexicon_update_ai_cleanup_v2.py
      - name: Commit canonical release artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add current-form-documents/the-way-current.epub current-form-documents/mobile-reader current-form-documents/original-name-registry.json rendered-documents-history change-logs/reports/2026-09-14-lexicon-update-ai-cleanup.json editor-notes/consistency/2026-09-14-lexicon-update-ai-cleanup.md README.md current-form-documents/README.md current-form-documents/EPUB-REFRESH-INSTRUCTIONS.md change-logs/HISTORY.md
          git diff --cached --quiet && { echo 'No release changes produced'; exit 1; }
          git commit -m "Lexicon update: clean up prior AI wording issues"
          git push
