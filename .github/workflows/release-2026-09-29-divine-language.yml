name: Release divine language 2026-09-29

on:
  push:
    branches:
      - release/divine-language-2026-09-29
    paths:
      - .github/workflows/release-2026-09-29-divine-language.yml

permissions:
  contents: write

jobs:
  release:
    if: ${{ !contains(github.event.head_commit.message, '[skip divine language release]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/divine-language-2026-09-29
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run exact 177-row canonical release
        run: python tools/local/release_2026_09_29_divine_language.py

      - name: Commit canonical release artifacts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add current-form-documents/the-way-current.epub current-form-documents/mobile-reader current-form-documents/original-name-registry.json rendered-documents-history change-logs/reports/2026-09-29-divine-language-release.json editor-notes/consistency/2026-09-29-divine-language-release.md README.md current-form-documents/README.md current-form-documents/EPUB-REFRESH-INSTRUCTIONS.md rendered-documents-history/LOG.md
          git diff --cached --quiet && { echo "No canonical release changes produced" >&2; exit 1; }
          git commit -m "Release divine language Sovereign/reign/pronoun audit [skip divine language release]"
          git push origin HEAD:release/divine-language-2026-09-29
