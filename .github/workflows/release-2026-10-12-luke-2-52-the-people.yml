name: Release Luke 2:52 the people

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release-2026-10-12-luke-2-52-the-people.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: canonical-luke-2-52-one-verse
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify and release exact approved canonical verse
        run: python tools/local/release_2026_10_12_luke_2_52_the_people.py
      - name: Commit canonical EPUB binary, fallback and provenance
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            original-documents/luke_restorative_translation.txt \
            current-form-documents/the-way-current.epub \
            current-form-documents/mobile-reader \
            current-form-documents/original-name-registry.json \
            rendered-documents-history \
            change-logs/reports/2026-10-12-luke-2-52-the-people-release.json \
            editor-notes/consistency/2026-10-12-luke-2-52-the-people-release.md \
            README.md current-form-documents/README.md \
            current-form-documents/EPUB-REFRESH-INSTRUCTIONS.md \
            rendered-documents-history/LOG.md
          git diff --cached --quiet && { echo 'No canonical release changes produced' >&2; exit 1; }
          git commit -m 'Release Luke 2:52 the people in canonical EPUB and fallback'
          git push origin HEAD:main
