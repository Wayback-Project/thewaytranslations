name: Release 2026-09-14 English article grammar consistency

on:
  push:
    branches:
      - consistency/english-grammar-articles-2026-09-14
    paths:
      - tools/local/release_2026_09_14_english_article_grammar.py
      - .github/workflows/release-2026-09-14-english-article-grammar.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: english-article-grammar-2026-09-14
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: consistency/english-grammar-articles-2026-09-14
          fetch-depth: 1

      - name: Apply and validate English grammar consistency updates
        run: python3 tools/local/release_2026_09_14_english_article_grammar.py

      - name: Commit canonical release artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md current-form-documents rendered-documents-history change-logs editor-notes
          if ! git diff --cached --quiet; then
            git commit -m "English grammar consistency updates"
            git push origin HEAD:consistency/english-grammar-articles-2026-09-14
          fi
