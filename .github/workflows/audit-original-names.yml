name: Audit original names and Genesis wording

on:
  push:
    branches:
      - consistency/original-names-genesis-2026-09-11
    paths:
      - tools/local/audit_original_names.py
      - .github/workflows/audit-original-names.yml

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: consistency/original-names-genesis-2026-09-11
      - name: Run audit
        run: python3 tools/local/audit_original_names.py
      - name: Commit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add change-logs/reports/2026-09-11-original-name-audit.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "consistency: record original-name audit"
          git push origin HEAD:consistency/original-names-genesis-2026-09-11
