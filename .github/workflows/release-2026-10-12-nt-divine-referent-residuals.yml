name: Release NT Father divine pronoun residuals 2026-10-12
on:
  push:
    branches: [main]
    paths: ['.github/workflows/release-2026-10-12-nt-divine-referent-residuals.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: way-nt-divine-residuals
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Release exact 45 approved New Testament divine referent corrections
        run: python tools/local/release_2026_10_12_nt_divine_referent_residuals.py
      - name: Commit canonical EPUB, mobile fallback, checksums, and records
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add current-form-documents/the-way-current.epub current-form-documents/mobile-reader current-form-documents/original-name-registry.json rendered-documents-history change-logs/reports/2026-10-12-nt-divine-referent-release.json editor-notes/consistency/2026-10-12-nt-divine-referent-release.md README.md current-form-documents/README.md current-form-documents/EPUB-REFRESH-INSTRUCTIONS.md rendered-documents-history/LOG.md
          git diff --cached --quiet && { echo 'No canonical release output' >&2; exit 1; }
          git commit -m 'Release 45 reviewed NT God Father pronoun corrections from canonical EPUB'
          git push origin HEAD:main
